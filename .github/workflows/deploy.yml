name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Publish only the default branch, whatever it is currently named.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site if it does not exist yet. The built-in
          # GITHUB_TOKEN is not allowed to do this ("Resource not accessible
          # by integration"), so Pages has to be switched on once by hand:
          # Settings -> Pages -> Source -> GitHub Actions. After that this is
          # a no-op, and it works unattended for a token with admin rights.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
